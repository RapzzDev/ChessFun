
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rapzz Chess</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

<style>
:root{
 --bg:#101010;
 --panel:#191919;
 --panel2:#222;
 --text:#f5f5f5;
 --muted:#888;
 --accent:#fff;
 --border:#303030;
 --light:#eeeeee;
 --dark:#333333;
 --green:#70b879;
 --red:#e45e5e;
}

*{box-sizing:border-box}

body{
 margin:0;
 background:var(--bg);
 color:var(--text);
 font-family:Arial,sans-serif;
 min-height:100vh;
}

button,select,input{font:inherit}

button{
 cursor:pointer;
 border:1px solid var(--border);
 background:#252525;
 color:white;
 border-radius:8px;
 padding:11px 14px;
 transition:.2s;
}

button:hover{
 background:#383838;
 border-color:#666;
}

button:disabled{
 opacity:.35;
 cursor:not-allowed;
}

.app{
 max-width:1100px;
 margin:auto;
 padding:22px;
}

header{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin-bottom:25px;
}

.logo{
 font-size:23px;
 font-weight:900;
 letter-spacing:4px;
}

.logo span{color:#888}

.header-right{
 display:flex;
 gap:8px;
}

.icon-btn{
 width:42px;
 height:42px;
 padding:0;
 font-size:18px;
}

.layout{
 display:grid;
 grid-template-columns:minmax(0,650px) minmax(250px,1fr);
 gap:22px;
 align-items:start;
}

.board-area{width:100%}

.player{
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:12px 15px;
 background:var(--panel);
 border-radius:9px;
 margin-bottom:10px;
}

.player-name{
 display:flex;
 align-items:center;
 gap:10px;
 font-weight:bold;
}

.avatar{
 width:32px;
 height:32px;
 border-radius:7px;
 display:grid;
 place-items:center;
 background:#333;
 font-size:19px;
}

.clock{
 font-size:21px;
 font-weight:bold;
 font-variant-numeric:tabular-nums;
 background:#292929;
 padding:8px 15px;
 border-radius:7px;
 min-width:90px;
 text-align:center;
}

.clock.active{
 background:#eeeeee;
 color:#111;
}

.clock.low{
 color:#ff6767;
}

.board-wrap{
 position:relative;
 width:100%;
 aspect-ratio:1;
}

.board{
 width:100%;
 height:100%;
 display:grid;
 grid-template-columns:repeat(8,1fr);
 grid-template-rows:repeat(8,1fr);
 border:4px solid #111;
 border-radius:4px;
 overflow:hidden;
}

.square{
 position:relative;
 display:flex;
 align-items:center;
 justify-content:center;
 aspect-ratio:1;
 user-select:none;
 cursor:pointer;
}

.square.light{background:var(--light)}
.square.dark{background:var(--dark)}

.square.selected{
 background:#aaa!important;
}

.square.last{
 background:#c5c56a!important;
}

.square.check{
 background:#d65353!important;
}

.piece{
 position:relative;
 z-index:2;
 font-family:"Segoe UI Symbol","DejaVu Sans",serif;
 font-size:clamp(25px,7.3vw,66px);
 line-height:1;
 pointer-events:none;
 font-weight:normal;
}

.piece.white{
 color:#fff;
 -webkit-text-stroke:1.2px #111;
 text-shadow:0 2px 1px #333;
}

.piece.black{
 color:#080808;
 -webkit-text-stroke:.7px #555;
 text-shadow:0 1px 1px #888;
}

.dot{
 position:absolute;
 width:24%;
 height:24%;
 border-radius:50%;
 background:#111;
 opacity:.35;
 z-index:1;
}

.capture-ring{
 position:absolute;
 inset:3px;
 border:5px solid #111;
 border-radius:50%;
 opacity:.5;
}

.coords{
 position:absolute;
 font-size:10px;
 font-weight:bold;
 z-index:3;
 opacity:.7;
 pointer-events:none;
}

.rank-label{top:3px;left:4px}
.file-label{bottom:3px;right:4px}

.move-ghost{
 position:absolute;
 z-index:10;
 display:flex;
 align-items:center;
 justify-content:center;
 pointer-events:none;
 transition:transform .19s cubic-bezier(.2,.7,.2,1);
}

.sidebar{
 display:flex;
 flex-direction:column;
 gap:13px;
}

.panel{
 background:var(--panel);
 padding:16px;
 border:1px solid var(--border);
 border-radius:11px;
}

.panel-title{
 font-size:13px;
 font-weight:bold;
 letter-spacing:1px;
 color:#aaa;
 margin-bottom:13px;
}

.status{
 display:flex;
 gap:10px;
 align-items:center;
}

.status-indicator{
 width:9px;
 height:9px;
 border-radius:50%;
 background:#777;
}

.status-indicator.green{background:var(--green)}
.status-indicator.red{background:var(--red)}

#statusText{
 font-size:14px;
 font-weight:bold;
}

.controls{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:8px;
}

.controls button{font-size:13px}

.history{
 height:180px;
 overflow-y:auto;
 background:#111;
 padding:10px;
 border-radius:7px;
 font-size:13px;
}

.history-row{
 display:grid;
 grid-template-columns:30px 1fr 1fr;
 padding:7px;
 border-bottom:1px solid #292929;
}

.history-row span:first-child{color:#777}
.history-row .active-move{color:white;font-weight:bold}

.time-categories{
 display:flex;
 flex-direction:column;
 gap:7px;
}

.category-btn{
 text-align:left;
 display:flex;
 justify-content:space-between;
 align-items:center;
}

.category-btn.active{
 border-color:white;
 background:#373737;
}

.category-name{font-weight:bold}
.category-desc{color:#888;font-size:11px}

.time-options{
 display:flex;
 flex-wrap:wrap;
 gap:6px;
 margin-top:9px;
}

.time-options button{
 flex:1;
 font-size:12px;
 padding:9px 5px;
}

.custom{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:8px;
 margin-top:10px;
}

.custom label{
 font-size:11px;
 color:#aaa;
 display:block;
 margin-bottom:5px;
}

.custom input{
 width:100%;
 padding:10px;
 background:#111;
 color:white;
 border:1px solid #444;
 border-radius:7px;
}

.primary{
 background:white;
 color:black;
 font-weight:bold;
}

.primary:hover{
 background:#ccc;
 color:black;
}

.modal{
 position:fixed;
 inset:0;
 z-index:100;
 background:#000b;
 display:none;
 align-items:center;
 justify-content:center;
 padding:20px;
}

.modal.show{display:flex}

.modal-content{
 width:100%;
 max-width:350px;
 padding:25px;
 text-align:center;
 background:#1d1d1d;
 border:1px solid #444;
 border-radius:15px;
 animation:modalIn .25s ease;
}

.modal-content h2{margin-top:0}

.modal-buttons{
 display:flex;
 gap:8px;
 margin-top:20px;
}

.modal-buttons button{flex:1}

@keyframes modalIn{
 from{transform:scale(.85);opacity:0}
 to{transform:scale(1);opacity:1}
}

@keyframes checkPulse{
 0%,100%{box-shadow:inset 0 0 0 0 #ff4444}
 50%{box-shadow:inset 0 0 20px 5px #ff4444}
}

.square.check{animation:checkPulse .8s infinite}

@keyframes captureFlash{
 0%{box-shadow:inset 0 0 0 0 white}
 50%{box-shadow:inset 0 0 20px white}
 100%{box-shadow:inset 0 0 0 0 white}
}

.square.captured{animation:captureFlash .3s}

.toast{
 position:fixed;
 top:20px;
 left:50%;
 transform:translateX(-50%) translateY(-80px);
 background:#eee;
 color:#111;
 padding:12px 20px;
 border-radius:9px;
 font-size:13px;
 font-weight:bold;
 z-index:200;
 transition:.3s;
 pointer-events:none;
}

.toast.show{
 transform:translateX(-50%) translateY(0);
}

.footer{
 text-align:center;
 margin-top:30px;
 color:#555;
 font-size:11px;
 letter-spacing:1px;
}

@media(max-width:800px){
 .app{padding:12px}
 .layout{grid-template-columns:1fr}
 .sidebar{display:grid;grid-template-columns:1fr 1fr}
 .sidebar .history-panel{grid-column:1/-1}
 .logo{font-size:19px}
}

@media(max-width:480px){
 .sidebar{display:flex}
 .piece{font-size:9vw}
 .clock{font-size:18px}
 header{margin-bottom:15px}
}
</style>
</head>

<body>

<div class="toast" id="toast"></div>

<div class="app">

<header>
 <div class="logo">RAPZZ<span> CHESS</span></div>
 <div class="header-right">
  <button class="icon-btn" onclick="toggleSound()" id="soundBtn">♫</button>
  <button class="icon-btn" onclick="flipBoard()">⇅</button>
 </div>
</header>

<div class="layout">

<section class="board-area">

 <div class="player">
  <div class="player-name">
   <div class="avatar">♟</div>
   <span id="blackName">Black</span>
  </div>
  <div class="clock" id="blackClock">05:00</div>
 </div>

 <div class="board-wrap" id="boardWrap">
  <div class="board" id="board"></div>
 </div>

 <div class="player" style="margin-top:10px;margin-bottom:0">
  <div class="player-name">
   <div class="avatar">♙</div>
   <span id="whiteName">White</span>
  </div>
  <div class="clock active" id="whiteClock">05:00</div>
 </div>

 <div class="controls" style="margin-top:14px">
  <button onclick="undoMove()">↶ Undo</button>
  <button onclick="restartGame()">⟳ Restart</button>
  <button onclick="offerDraw()">⚖ Minta Remis</button>
  <button onclick="resignGame()">⚑ Menyerah</button>
 </div>

</section>

<aside class="sidebar">

 <div class="panel">
  <div class="panel-title">PERTANDINGAN</div>
  <div class="status">
   <div class="status-indicator green" id="statusDot"></div>
   <div id="statusText">White to move</div>
  </div>
  <p style="font-size:12px;color:#888;margin-bottom:0" id="gameInfo">
   Move 1 · Standard
  </p>
 </div>

 <div class="panel">
  <div class="panel-title">MODE PERMAINAN</div>
  <div class="time-categories">
   <button class="category-btn" onclick="chooseCategory('super')">
    <span class="category-name">⚡ Super Cepat</span>
    <span class="category-desc">Bullet</span>
   </button>
   <div class="time-options" id="superOptions"></div>

   <button class="category-btn" onclick="chooseCategory('fast')">
    <span class="category-name">🔥 Cepat</span>
    <span class="category-desc">Blitz</span>
   </button>
   <div class="time-options" id="fastOptions"></div>

   <button class="category-btn" onclick="chooseCategory('slow')">
    <span class="category-name">♟ Santai</span>
    <span class="category-desc">Rapid</span>
   </button>
   <div class="time-options" id="slowOptions"></div>
  </div>

  <div class="panel-title" style="margin-top:17px">CUSTOM WAKTU</div>
  <div class="custom">
   <div>
    <label>Menit</label>
    <input type="number" id="customMinutes" min="1" max="180" value="10">
   </div>
   <div>
    <label>Increment (detik)</label>
    <input type="number" id="customIncrement" min="0" max="60" value="0">
   </div>
  </div>
  <button class="primary" style="width:100%;margin-top:10px" onclick="customTime()">
   Gunakan Custom
  </button>
 </div>

 <div class="panel">
  <div class="panel-title">PENGATURAN</div>
  <div class="controls">
   <button onclick="setMode('pvp')">2 Players</button>
   <button onclick="setMode('ai')">VS Computer</button>
  </div>
  <p style="font-size:11px;color:#777;margin-bottom:0">
   AI menggunakan strategi dasar. Tidak setara dengan engine catur profesional.
  </p>
 </div>

 <div class="panel history-panel">
  <div class="panel-title">RIWAYAT LANGKAH</div>
  <div class="history" id="history">
   Belum ada langkah.
  </div>
 </div>

</aside>
</div>

<div class="footer">
 RAPZZ CHESS · © 2026 RAPZZ
</div>

</div>

<div class="modal" id="modal">
 <div class="modal-content">
  <h2 id="modalTitle">Game Over</h2>
  <p id="modalText"></p>
  <div class="modal-buttons" id="modalButtons">
   <button onclick="closeModal()">Tutup</button>
   <button class="primary" onclick="restartGame();closeModal()">Main Lagi</button>
  </div>
 </div>
</div>

<script>
const game = new Chess();

let mode="pvp";
let flipped=false;
let selected=null;
let legalMoves=[];
let lastMove=null;
let soundEnabled=true;
let clocks={w:300,b:300};
let increment=0;
let timer=null;
let clockRunning=false;
let gameFinished=false;
let drawOffer=false;
let aiThinking=false;
let timePreset="5+0";
let animationBusy=false;
let clockStarted=false;

const pieces={
 wk:"♔",wq:"♕",wr:"♖",wb:"♗",wn:"♘",wp:"♙",
 bk:"♚",bq:"♛",br:"♜",bb:"♝",bn:"♞",bp:"♟"
};

const presets={
 super:[
  {label:"1+0",min:1,inc:0},
  {label:"2+1",min:2,inc:1},
  {label:"3+0",min:3,inc:0}
 ],
 fast:[
  {label:"5+0",min:5,inc:0},
  {label:"5+3",min:5,inc:3},
  {label:"10+0",min:10,inc:0}
 ],
 slow:[
  {label:"15+10",min:15,inc:10},
  {label:"20+0",min:20,inc:0},
  {label:"30+0",min:30,inc:0}
 ]
};

function audio(freq,duration=.09,type="sine",volume=.07){
 if(!soundEnabled)return;
 try{
  const ctx=new (window.AudioContext||window.webkitAudioContext)();
  const osc=ctx.createOscillator();
  const gain=ctx.createGain();
  osc.type=type;
  osc.frequency.value=freq;
  gain.gain.setValueAtTime(volume,ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+duration);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start();
  osc.stop(ctx.currentTime+duration);
  osc.onended=()=>ctx.close();
 }catch(e){}
}

function playSound(type){
 if(type==="move")audio(420);
 if(type==="capture")audio(220,.15,"triangle");
 if(type==="check"){
  audio(700,.13,"square");
  setTimeout(()=>audio(500,.13,"square"),130);
 }
 if(type==="end"){
  audio(400,.2);
  setTimeout(()=>audio(300,.3),200);
 }
 if(type==="success"){
  audio(500,.15);
  setTimeout(()=>audio(650,.15),150);
  setTimeout(()=>audio(800,.25),300);
 }
}

function toggleSound(){
 soundEnabled=!soundEnabled;
 document.getElementById("soundBtn").textContent=
  soundEnabled?"♫":"♪";
 showToast(soundEnabled?"Suara aktif":"Suara mati");
}

function showToast(text){
 const t=document.getElementById("toast");
 t.textContent=text;
 t.classList.add("show");
 clearTimeout(t._timer);
 t._timer=setTimeout(()=>t.classList.remove("show"),1800);
}

function showModal(title,text,buttons){
 document.getElementById("modalTitle").textContent=title;
 document.getElementById("modalText").textContent=text;
 const area=document.getElementById("modalButtons");
 area.innerHTML="";
 buttons.forEach(b=>{
  const btn=document.createElement("button");
  btn.textContent=b.label;
  if(b.primary)btn.className="primary";
  btn.onclick=b.action;
  area.appendChild(btn);
 });
 document.getElementById("modal").classList.add("show");
}

function closeModal(){
 document.getElementById("modal").classList.remove("show");
}

function squareName(i){
 return "abcdefgh"[i%8]+(8-Math.floor(i/8));
}

function render(){
 const el=document.getElementById("board");
 el.innerHTML="";

 const position=game.board();
 const checkKing=game.in_check()?
  game.board().flat().findIndex(p=>p&&p.type==="k"&&p.color===game.turn()):-1;

 for(let j=0;j<64;j++){
  const i=flipped?63-j:j;
  const r=Math.floor(i/8);
  const c=i%8;
  const square=document.createElement("div");

  square.className="square "+((r+c)%2?"dark":"light");

  if(selected===squareName(i))square.classList.add("selected");

  if(lastMove&&(lastMove.from===squareName(i)||
    lastMove.to===squareName(i)))
   square.classList.add("last");

  const currentCheck=game.in_check()&&
   squareName(i)===findKing(game.turn());

  if(currentCheck)square.classList.add("check");

  const move=legalMoves.find(m=>m.to===squareName(i));

  if(move){
   const mark=document.createElement("div");
   mark.className=position[r][c]?"capture-ring":"dot";
   square.appendChild(mark);
  }

  const piece=position[r][c];
  if(piece){
   const span=document.createElement("span");
   span.className="piece "+(piece.color==="w"?"white":"black");
   span.textContent=pieces[piece.color+piece.type];
   square.appendChild(span);
  }

  if(c===0){
   const label=document.createElement("span");
   label.className="coords rank-label";
   label.textContent=8-r;
   square.appendChild(label);
  }

  if(r===7){
   const label=document.createElement("span");
   label.className="coords file-label";
   label.textContent="abcdefgh"[c];
   square.appendChild(label);
  }

  square.onclick=()=>selectSquare(squareName(i));
  el.appendChild(square);
 }

 updateInterface();
}

function findKing(side){
 const b=game.board();
 for(let r=0;r<8;r++)
  for(let c=0;c<8;c++)
   if(b[r][c]&&b[r][c].type==="k"&&b[r][c].color===side)
    return "abcdefgh"[c]+(8-r);
 return "";
}

function updateInterface(){
 document.getElementById("whiteClock").textContent=
  formatTime(clocks.w);
 document.getElementById("blackClock").textContent=
  formatTime(clocks.b);

 document.getElementById("whiteClock").classList.toggle(
  "active",game.turn()==="w"&&clockRunning&&!gameFinished
 );
 document.getElementById("blackClock").classList.toggle(
  "active",game.turn()==="b"&&clockRunning&&!gameFinished
 );

 document.getElementById("whiteClock").classList.toggle("low",clocks.w<10);
 document.getElementById("blackClock").classList.toggle("low",clocks.b<10);

 const names={
  w:mode==="ai"?"You":"White",
  b:mode==="ai"?"Computer":"Black"
 };

 document.getElementById("whiteName").textContent=names.w;
 document.getElementById("blackName").textContent=names.b;

 document.getElementById("gameInfo").textContent=
  "Move "+game.move_number()+" · "+timePreset;

 let text=game.turn()==="w"?"White to move":"Black to move";
 let dot="green";

 if(game.in_check()){
  text+=" · CHECK!";
  dot="red";
 }

 if(gameFinished)dot="red";

 document.getElementById("statusText").textContent=text;
 document.getElementById("statusDot").className=
  "status-indicator "+dot;

 updateHistory();
}

function formatTime(seconds){
 seconds=Math.max(0,Math.ceil(seconds));
 return String(Math.floor(seconds/60)).padStart(2,"0")+":"+
  String(seconds%60).padStart(2,"0");
}

function updateHistory(){
 const moves=game.history();
 const el=document.getElementById("history");

 if(!moves.length){
  el.textContent="Belum ada langkah.";
  return;
 }

 el.innerHTML="";
 for(let i=0;i<moves.length;i+=2){
  const row=document.createElement("div");
  row.className="history-row";

  const n=document.createElement("span");
  n.textContent=(Math.floor(i/2)+1)+".";

  const w=document.createElement("span");
  w.textContent=moves[i]||"";

  const b=document.createElement("span");
  b.textContent=moves[i+1]||"";

  row.append(n,w,b);
  el.appendChild(row);
 }
 el.scrollTop=el.scrollHeight;
}

function selectSquare(sq){
 if(gameFinished||animationBusy||
   (mode==="ai"&&game.turn()==="b")||aiThinking)return;

 const piece=game.get(sq);

 if(selected){
  const move=legalMoves.find(m=>m.to===sq);
  if(move){
   executeMove(selected,sq);
   return;
  }
 }

 if(piece&&piece.color===game.turn()){
  selected=sq;
  legalMoves=game.moves({square:sq,verbose:true});
 }else{
  selected=null;
  legalMoves=[];
 }

 render();
}

function animateMove(from,to,callback){
 const wrap=document.getElementById("boardWrap");
 const squares=[...document.querySelectorAll(".square")];

 const findSquare=sq=>{
  const index="abcdefgh".indexOf(sq[0])+
   (8-Number(sq[1]))*8;
  return squares.find((_,j)=>{
   const boardIndex=flipped?63-j:j;
   return boardIndex===index;
  });
 };

 const a=findSquare(from);
 const b=findSquare(to);

 if(!a||!b){callback();return}

 const source=a.querySelector(".piece");
 if(!source){callback();return}

 const start=a.getBoundingClientRect();
 const end=b.getBoundingClientRect();
 const parent=wrap.getBoundingClientRect();

 const ghost=document.createElement("div");
 ghost.className="move-ghost";
 ghost.textContent=source.textContent;
 ghost.style.width=start.width+"px";
 ghost.style.height=start.height+"px";
 ghost.style.left=(start.left-parent.left)+"px";
 ghost.style.top=(start.top-parent.top)+"px";
 ghost.style.fontSize=getComputedStyle(source).fontSize;
 ghost.style.color=getComputedStyle(source).color;
 ghost.style.webkitTextStroke=getComputedStyle(source).webkitTextStroke;
 ghost.style.textShadow=getComputedStyle(source).textShadow;

 wrap.appendChild(ghost);
 source.style.visibility="hidden";

 requestAnimationFrame(()=>{
  ghost.style.transform=
   `translate(${end.left-start.left}px,${end.top-start.top}px)`;
 });

 setTimeout(()=>{
  ghost.remove();
  callback();
 },200);
}

function executeMove(from,to){
 let options={};
 const piece=game.get(from);

 if(piece&&piece.type==="p"&&(to[1]==="1"||to[1]==="8")){
  let choice=prompt("Promosi bidak: Q, R, B, N","q");
  choice=(choice||"q").toLowerCase();
  if(!["q","r","b","n"].includes(choice))choice="q";
  options.promotion=choice;
 }

 const isCapture=!!game.get(to)||
  (piece&&piece.type==="p"&&from[0]!==to[0]);

 const previousTurn=game.turn();

 animationBusy=true;
 selected=null;
 legalMoves=[];
 render();

 animateMove(from,to,()=>{
  const result=game.move({from,to,...options});
  if(!result){
   animationBusy=false;
   render();
   return;
  }

  lastMove={from,to};
  if(clockStarted)clocks[previousTurn]+=increment;

  animationBusy=false;
  playSound(isCapture?"capture":"move");

  render();
  checkGame();

  if(mode==="ai"&&game.turn()==="b"&&!gameFinished){
   aiMove();
  }
 });
}

function checkGame(){
 if(game.in_checkmate()){
  finishGame(
   game.turn()==="w"?"Black Wins!":"White Wins!",
   "Checkmate! Raja lawan berhasil diserang.",
   "success"
  );
 }else if(game.in_stalemate()){
  finishGame("Draw!","Stalemate — tidak ada langkah legal.","end");
 }else if(game.insufficient_material()){
  finishGame("Draw!","Insufficient material.","end");
 }else if(game.in_threefold_repetition()){
  finishGame("Draw!","Threefold repetition.","end");
 }else if(game.in_draw()){
  finishGame("Draw!","Pertandingan berakhir remis.","end");
 }else if(game.in_check()){
  playSound("check");
  showToast("CHECK! Raja sedang diserang.");
 }
}

function finishGame(title,text,sound){
 gameFinished=true;
 stopClock();
 playSound(sound);
 document.getElementById("statusText").textContent=title;
 showModal(title,text,[
  {label:"Tutup",action:closeModal},
  {label:"Main Lagi",primary:true,action:()=>{
   closeModal();
   restartGame();
  }}
 ]);
}

function startClock(){
 if(clockRunning||gameFinished)return;
 clockRunning=true;
 clockStarted=true;
 clearInterval(timer);
 timer=setInterval(()=>{
  if(gameFinished||!clockRunning)return;

  clocks[game.turn()]--;
  updateInterface();

  if(clocks[game.turn()]<=0){
   clocks[game.turn()]=0;
   const loser=game.turn();
   gameFinished=true;
   stopClock();
   showModal(
    "Waktu Habis!",
    (loser==="w"?"White":"Black")+" kehabisan waktu.",
    [{label:"Main Lagi",primary:true,action:()=>{
     closeModal();restartGame();
    }}]
   );
  }
 },1000);
}

function stopClock(){
 clockRunning=false;
 clearInterval(timer);
 timer=null;
}

function restartGame(){
 stopClock();
 game.reset();
 clocks={w:baseTime,b:baseTime};
 selected=null;
 legalMoves=[];
 lastMove=null;
 gameFinished=false;
 drawOffer=false;
 clockStarted=false;
 animationBusy=false;
 aiThinking=false;
 render();
 showToast("Pertandingan dimulai ulang.");
}

function undoMove(){
 if(gameFinished||animationBusy)return;
 if(mode==="ai"&&game.history().length>=2){
  game.undo();
  game.undo();
 }else{
  game.undo();
 }
 if(!game.history().length)stopClock();
 gameFinished=false;
 selected=null;
 legalMoves=[];
 lastMove=null;
 clocks.w=Math.min(baseTime,clocks.w);
 clocks.b=Math.min(baseTime,clocks.b);
 render();
 showToast("Langkah dikembalikan.");
}

function flipBoard(){
 flipped=!flipped;
 render();
}

function setMode(m){
 mode=m;
 restartGame();
 showToast(m==="ai"?"Mode VS Computer":"Mode 2 Players");
}

function offerDraw(){
 if(gameFinished||game.history().length<2)return;

 if(mode==="ai"){
  showModal("Permintaan Remis","Komputer akan mempertimbangkan permintaan remis.",[
   {label:"Batal",action:closeModal},
   {label:"Ajukan",primary:true,action:()=>{
    closeModal();
    if(Math.random()<.35){
     finishGame("Remis Disetujui","Komputer menerima permintaan remis.","end");
    }else{
     showToast("Komputer menolak remis.");
    }
   }}
  ]);
  return;
 }

 if(drawOffer){
  drawOffer=false;
  finishGame("Draw!","Kedua pemain menyetujui remis.","end");
  return;
 }

 drawOffer=true;
 showModal("Permintaan Remis","Lawan, apakah kamu menerima tawaran remis?",[
  {label:"Tolak",action:()=>{
   drawOffer=false;
   closeModal();
   showToast("Remis ditolak.");
  }},
  {label:"Terima",primary:true,action:()=>{
   drawOffer=false;
   finishGame("Draw!","Kedua pemain menyetujui remis.","end");
  }}
 ]);
}

function resignGame(){
 if(gameFinished)return;
 showModal("Menyerah?","Apakah kamu yakin ingin menyerah?",[
  {label:"Batal",action:closeModal},
  {label:"Menyerah",primary:true,action:()=>{
   closeModal();
   finishGame(
    "Game Over",
    (game.turn()==="w"?"White":"Black")+" menyerah.",
    "end"
   );
  }}
 ]);
}

let baseTime=300;

function chooseCategory(category){
 const buttons=document.querySelectorAll(".category-btn");
 const map={super:0,fast:1,slow:2};
 buttons.forEach((b,i)=>b.classList.toggle("active",i===map[category]));
 renderOptions(category);
}

function renderOptions(category){
 const map={
  super:"superOptions",
  fast:"fastOptions",
  slow:"slowOptions"
 };

 const el=document.getElementById(map[category]);
 el.innerHTML="";

 presets[category].forEach(p=>{
  const b=document.createElement("button");
  b.textContent=p.label;
  b.onclick=()=>setTime(p.min,p.inc,p.label);
  el.appendChild(b);
 });
}

function setTime(minutes,inc,label){
 if(!Number.isFinite(minutes)||minutes<1||minutes>180||
   !Number.isFinite(inc)||inc<0||inc>60)return;

 baseTime=minutes*60;
 increment=inc;
 timePreset=label;
 restartGame();
 showToast("Waktu diatur: "+label);
}

function customTime(){
 const min=Number(document.getElementById("customMinutes").value);
 const inc=Number(document.getElementById("customIncrement").value);

 if(!Number.isInteger(min)||min<1||min>180||
   !Number.isInteger(inc)||inc<0||inc>60){
  showToast("Waktu custom tidak valid.");
  return;
 }

 setTime(min,inc,min+"+"+inc);
}

function aiMove(){
 if(gameFinished||game.turn()!=="b")return;
 aiThinking=true;

 setTimeout(()=>{
  if(gameFinished){aiThinking=false;return}

  const moves=game.moves({verbose:true});
  if(!moves.length){aiThinking=false;checkGame();return}

  const values={p:100,n:320,b:330,r:500,q:900,k:20000};

  function scoreMove(m){
   let score=Math.random()*15;
   if(m.captured)score+=values[m.captured]*1.1;
   if(m.promotion)score+=800;
   if(m.san.includes("+"))score+=45;
   if(m.san.includes("#"))score+=100000;

   game.move(m);
   const opponentMoves=game.moves({verbose:true});

   if(game.in_checkmate())score+=100000;
   else if(game.in_check())score+=30;

   if(opponentMoves.length===0&&game.in_stalemate())score-=10000;

   game.undo();
   return score;
  }

  moves.sort((a,b)=>scoreMove(b)-scoreMove(a));
  const chosen=moves[0];

  aiThinking=false;
  executeMove(chosen.from,chosen.to);
 },450);
}

document.addEventListener("keydown",e=>{
 if(e.key==="Escape")closeModal();
});

for(const category of ["super","fast","slow"])
 renderOptions(category);

setTime(5,0,"5+0");
render();
</script>
